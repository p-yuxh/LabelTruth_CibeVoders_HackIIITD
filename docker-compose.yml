version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: labeltruth_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: labeltruth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labeltruth_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/labeltruth
      - TINYFISH_API_KEY=${TINYFISH_API_KEY:-}
    depends_on:
      - db

volumes:
  postgres_data:

